<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷りたてドリル | 教科書本文からテスト対策プリント作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F3ED; --panel:#FFFFFF; --ink:#232C36; --ink-soft:#5B6470;
    --rule:#D9D5C7; --rule-strong:#B9B3A0; --red:#B23A2F; --red-soft:#E8CFC9;
    --green:#3B6E52; --green-soft:#D9E6DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans JP', sans-serif; line-height:1.7; }
  h1,h2,h3{ font-family:'Zen Kaku Gothic New', sans-serif; letter-spacing:.02em; }

  .app{ max-width:1280px; margin:0 auto; padding:32px 24px 80px; }
  header.site{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:28px; padding-bottom:20px; border-bottom:3px solid var(--ink);
  }
  header.site h1{ font-size:26px; font-weight:900; margin:0; }
  header.site h1 .accent{ color:var(--red); }
  header.site .tagline{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  header.site .stamp{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--green);
    border:1.5px solid var(--green); border-radius:999px; padding:4px 12px; transform:rotate(-3deg); white-space:nowrap;
  }

  .layout{ display:grid; grid-template-columns:380px 1fr; gap:28px; align-items:start; }
  @media (max-width:920px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel); border:1.5px solid var(--rule-strong); border-radius:4px; padding:22px;
    position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto;
  }
  @media (max-width:920px){ .panel{ position:static; max-height:none; } }

  .panel h2{ font-size:15px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel h2 .num{
    display:inline-flex; align-items:center; justify-content:center; width:20px;height:20px;
    background:var(--ink); color:var(--paper); border-radius:50%; font-size:11px; font-family:'JetBrains Mono',monospace;
  }
  .panel .hint{ font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; }
  .section-block{ margin-bottom:26px; }
  .section-block:last-of-type{ margin-bottom:18px; }

  .selector-row{ display:flex; gap:8px; margin-bottom:10px; }
  .selector-row select{
    flex:1; border:1.5px solid var(--rule-strong); border-radius:3px; padding:9px 8px;
    font-family:'Noto Sans JP', sans-serif; font-size:13px; color:var(--ink); background:#FCFBF8;
  }
  .selector-row select:focus{ outline:2px solid var(--red); outline-offset:1px; }

  .part-checks{ display:flex; flex-direction:column; gap:2px; }
  .part-check-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border:1px solid var(--rule-strong); border-radius:3px; margin-bottom:6px; background:#FCFBF8;
  }
  .part-check-row label{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; flex:1; }
  .part-check-row input[type=checkbox]{ accent-color:var(--red); width:16px; height:16px; }
  .part-check-row .p-badges{ display:flex; gap:4px; }
  .part-check-row .badge{
    font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--ink-soft);
    border:1px solid var(--rule-strong); border-radius:3px; padding:1px 5px; white-space:nowrap;
  }
  .part-check-row .badge.has-ja{ color:var(--green); border-color:var(--green); }

  .type-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed var(--rule); }
  .type-row:last-child{ border-bottom:none; }
  .type-row label.tname{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
  .type-row input[type=checkbox]{ width:16px;height:16px; accent-color:var(--red); cursor:pointer; }
  .type-row .count{ display:flex; align-items:center; gap:6px; }
  .type-row .count button{
    width:22px;height:22px; border:1px solid var(--rule-strong); background:#fff; border-radius:3px;
    font-size:13px; cursor:pointer; line-height:1; color:var(--ink);
  }
  .type-row .count button:hover{ background:var(--paper); }
  .type-row .count span{ font-family:'JetBrains Mono',monospace; font-size:12.5px; width:18px; text-align:center; }
  .type-row .avail{ font-size:10.5px; color:var(--ink-soft); }
  .type-row.disabled{ opacity:.4; pointer-events:none; }

  .mode-toggle{
    display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink);
    border:1px solid var(--rule-strong); border-radius:3px; padding:10px 12px; margin-bottom:12px; background:#FCFBF8;
  }
  .mode-toggle label{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .mode-toggle input[type=radio]{ accent-color:var(--red); }

  .passage-block{
    border:1px solid var(--rule-strong); border-radius:3px; background:var(--paper);
    padding:14px 18px; font-size:13.5px; line-height:1.8; margin-bottom:16px;
  }
  .blank-num{ color:var(--red); font-weight:700; }
  .underline-seg{ text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:1.5px; }
  .underline-label{ color:var(--red); font-size:10px; font-weight:700; margin:0 2px; }
  .reorder-num{ color:var(--red); font-weight:700; }
  .reorder-blank-line{ color:var(--rule-strong); letter-spacing:1px; }
  .sub-q{ margin:16px 0 8px; font-size:13px; font-weight:700; }
  .qitem-inline{ display:inline-block; margin:0 16px 8px 0; font-size:12.5px; }
  .ja-hint{ color:var(--ink-soft); font-size:12px; margin-top:3px; }

  .generate-btn{
    width:100%; padding:13px; background:var(--ink); color:var(--paper); border:none; border-radius:3px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:.03em;
  }
  .generate-btn:hover{ background:#3a4552; }
  .err{ margin-top:10px; font-size:12.5px; color:var(--red); background:var(--red-soft); border:1px solid var(--red); border-radius:3px; padding:8px 10px; }

  .stage{ min-height:400px; }
  .empty-state{ border:2px dashed var(--rule-strong); border-radius:4px; padding:60px 30px; text-align:center; color:var(--ink-soft); background:var(--panel); }
  .empty-state .big{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:16px; color:var(--ink); margin-bottom:6px; }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar .toggles{ display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); }
  .toolbar label{ display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
  .print-btn{
    padding:9px 18px; background:var(--red); color:#fff; border:none; border-radius:3px;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
  }
  .print-btn:hover{ background:#963026; }

  .sheet{ background:#fff; border:1px solid var(--rule-strong); box-shadow:0 2px 10px rgba(0,0,0,.06); padding:34px 38px; margin-bottom:22px; }
  .sheet-header{ display:grid; grid-template-columns:1fr auto; gap:16px; padding-bottom:14px; margin-bottom:22px; border-bottom:2.5px solid var(--ink); }
  .sheet-header .title-area .kicker{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .sheet-header .title-area h3{ margin:2px 0 0; font-size:20px; }
  .idbox{ display:grid; grid-template-columns:repeat(3,72px); border:1.3px solid var(--ink); }
  .idbox .cell{ border-right:1.3px solid var(--ink); border-bottom:1.3px solid var(--ink); padding:4px 6px; }
  .idbox .cell:last-child{ border-right:none; }
  .idbox .cell:nth-last-child(-n+3){ border-bottom:none; }
  .idbox .cell .lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--ink-soft); }

  .qtype-section{ margin-bottom:26px; page-break-inside:avoid; }
  .qtype-section h4{ font-size:13.5px; margin:0 0 12px; padding:5px 10px; background:var(--ink); color:var(--paper); display:inline-block; border-radius:2px; }
  .qitem{ display:flex; gap:10px; margin-bottom:14px; font-size:13.5px; page-break-inside:avoid; }
  .qitem .qn{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--red); min-width:22px; }
  .qitem .qbody{ flex:1; }
  .answer-line{ display:inline-block; min-width:220px; border-bottom:1px solid var(--ink); margin-left:6px; }
  .reorder-words{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .reorder-words span{ border:1px solid var(--rule-strong); border-radius:3px; padding:3px 9px; font-size:12.5px; background:var(--paper); }
  .tf-choice{ display:inline-flex; gap:14px; margin-left:10px; font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  .tf-choice span{ border:1px solid var(--ink-soft); border-radius:50%; padding:2px 8px; }

  .answer-key .sheet-header{ border-bottom-color:var(--green); }
  .answer-key .kicker{ color:var(--green); }
  .answer-key .qn{ color:var(--green); }
  .ans-text{ color:var(--green); font-weight:600; }
  footer.credit{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }

  @media print{
    body{ background:#fff; }
    .no-print{ display:none !important; }
    .app{ padding:0; max-width:none; }
    .layout{ display:block; }
    .sheet{ box-shadow:none; border:none; padding:0; margin:0; }
    .qtype-section{ break-inside:avoid; }
    .answer-key{ break-before:page; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="site">
    <div class="brand">
      <h1>刷<span class="accent">り</span>たてドリル</h1>
      <p class="tagline">英語本文＋日本語訳から、定期テスト対策プリントを組み立てる</p>
    </div>
    <div class="stamp">OFFLINE / NO AI</div>
  </header>

  <div class="layout">

    <div class="panel no-print">

      <div class="section-block">
        <h2><span class="num">1</span>教材を選ぶ</h2>
        <p class="hint">学年とProgramを選び、使うPartにチェックを入れてください。</p>
        <div class="selector-row">
          <select id="gradeSelect"></select>
          <select id="programSelect"></select>
        </div>
        <div id="partChecks" class="part-checks"></div>
      </div>

      <div class="section-block">
        <h2><span class="num">2</span>出題設定</h2>
        <p class="hint">形式ごとにON/OFFと出題数を選べます。</p>
        <div class="mode-toggle" id="modeToggle">
          <label><input type="radio" name="printMode" value="itemized" checked> 項目別問題（今まで通り）</label>
          <label><input type="radio" name="printMode" value="longReading"> 長文読解形式（入試スタイル）</label>
        </div>
        <div id="typeList"></div>
      </div>

      <button class="generate-btn" id="genBtn">プリントを生成する</button>
      <div id="errBox"></div>
    </div>

    <div class="stage" id="stage">
      <div class="empty-state">
        <div class="big">まだプリントは生成されていません</div>
        教材を選び、「プリントを生成する」を押してください。
      </div>
    </div>

  </div>
</div>

const STOPWORDS = new Set(['a','an','the','is','are','was','were','am','be','been','being','to','of','in','on','at','and','but','or','this','that','these','those','it','its','he','she','they','we','you','i','my','your','his','her','their','our','not','do','does','did','has','have','had','with','for','as','by','from','so','if','than','then','there','here','what','who','when','where','why','how','all','some','no','yes','can','will','would','could','should']);
const LOANWORDS = new Set(['bento','bentos','ekiben','ekibens','kyara-ben','kyaraben','unagi','yokan','udon','kitsune','sushi','natto','ramen','chawan-mushi','chawanmushi','chawan','mushi','ebiken','manga','kanji','anime']);

function isSubstantialSentence(s){
  return (s.match(/[A-Za-z']+/g) || []).length >= 5;
}
function pickBlankWord(sentence){
  const tokens = sentence.match(/[A-Za-z']+/g) || [];
  const candidates = tokens.filter((w, idx) => {
    if(w.length < 4) return false;
    const lower = w.toLowerCase();
    if(STOPWORDS.has(lower)) return false;
    if(LOANWORDS.has(lower)) return false;
    const isCapitalized = /^[A-Z][a-z']*$/.test(w);
    if(isCapitalized && idx !== 0) return false; // likely a name/place, not core vocabulary
    return true;
  });
  if(!candidates.length) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function esc(s){ return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickRandom(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function splitEnglishSentences(text){
  return text.replace(/\s+/g,' ').split(/(?<!\bMr\.)(?<!\bMrs\.)(?<!\bMs\.)(?<!\bDr\.)(?<!\bSt\.)(?<=[.?!]|[.?!]["'\u201d\u2019])\s+(?=[A-Z0-9"'])/).map(s=>s.trim()).filter(Boolean);
}
function splitJapaneseSentences(text){
  return text.replace(/\s+/g,'').split(/(?<=[。！？])(?!」)/).map(s=>s.trim()).filter(Boolean);
}
function pairSentences(en, ja){
  if(!en || !ja) return [];
  const enS = splitEnglishSentences(en);
  const jaS = splitJapaneseSentences(ja);
  const n = Math.min(enS.length, jaS.length);
  const pairs = [];
  for(let i=0;i<n;i++) pairs.push({ en: enS[i], ja: jaS[i] });
  return pairs;
}

function gradeOf(label){ return label.split(' ')[0]; } // "中1" / "中2" / "中3"
function programsForGrade(grade){ return PROGRAMS.filter(p => gradeOf(p.label) === grade); }
function currentProgram(){ return PROGRAMS.find(p => p.label === selectedProgramLabel) || null; }
function currentPassage(){
  const prog = currentProgram();
  if(!prog) return null;
  const parts = prog.parts.filter(pt => selectedParts.has(pt.partLabel));
  if(!parts.length) return null;
  return {
    label: prog.label,
    textEn: parts.map(pt => pt.textEn).join(' '),
    textJa: parts.map(pt => pt.textJa).join(''),
    bank: {
      qa: parts.flatMap(pt => pt.qa),
      trueFalse: parts.flatMap(pt => pt.trueFalse)
    }
  };
}
function sentencesWithJa(textEn, textJa){
  const enS = splitEnglishSentences(textEn);
  const jaS = textJa ? splitJapaneseSentences(textJa) : [];
  return enS.map((s,i) => ({ en:s, ja: jaS[i] || null }));
}

/* ---------- auto generators from English text ---------- */
function genFillBlank(textEn, textJa, n){
  const all = sentencesWithJa(textEn, textJa).filter(x => isSubstantialSentence(x.en));
  const chosen = pickRandom(all, n * 3); // oversample, since some sentences yield no valid blank word
  const results = [];
  for(const x of chosen){
    if(results.length >= n) break;
    const target = pickBlankWord(x.en);
    if(!target) continue;
    const re = new RegExp('\\b'+escapeRegExp(target)+'\\b');
    results.push({ sentence:x.en.replace(re,'___'), answer:target, ja:x.ja });
  }
  return results;
}
function genReorder(textEn, textJa, n){
  const all = sentencesWithJa(textEn, textJa).filter(x => isSubstantialSentence(x.en));
  const chosen = pickRandom(all, n);
  return chosen.map(x => {
    const clean = x.en.replace(/[.?!]+\s*$/,'').trim();
    const words = clean.split(/\s+/);
    let shuffled = shuffle(words);
    if(words.length > 2){
      let tries = 0;
      while(shuffled.join(' ') === words.join(' ') && tries < 5){ shuffled = shuffle(words); tries++; }
    }
    return { words:shuffled, answer:x.en, ja:x.ja };
  });
}
function genToJapanese(pairs, n){
  const substantial = pairs.filter(p => isSubstantialSentence(p.en));
  return pickRandom(substantial, n).map(p => ({ english:p.en, answer:p.ja }));
}
function genToEnglish(pairs, n){
  const substantial = pairs.filter(p => isSubstantialSentence(p.en));
  return pickRandom(substantial, n).map(p => ({ japanese:p.ja, answer:p.en }));
}

/* ---------- true/false: auto-generate by negating or altering a fact, bank items get priority ---------- */
const NEG_MAP = {
  "isn't":"is", "is not":"is", "aren't":"are", "are not":"are", "wasn't":"was", "was not":"was",
  "weren't":"were", "were not":"were", "don't":"do", "do not":"do", "doesn't":"does", "does not":"does",
  "didn't":"did", "did not":"did", "haven't":"have", "have not":"have", "hasn't":"has", "has not":"has",
  "hadn't":"had", "had not":"had", "can't":"can", "cannot":"can", "can not":"can", "won't":"will",
  "will not":"will", "wouldn't":"would", "would not":"would", "shouldn't":"should", "should not":"should",
  "mustn't":"must", "must not":"must", "couldn't":"could", "could not":"could"
};
const POS_AUX = ["is","are","was","were","do","does","did","have","has","had","can","could","will","would","should","must"];

function falsifySentence(s){
  for(const neg in NEG_MAP){
    const re = new RegExp('\\b'+neg.replace(/'/g, "['’]")+'\\b','i');
    if(re.test(s)) return s.replace(re, NEG_MAP[neg]);
  }
  for(const aux of POS_AUX){
    const re = new RegExp('\\b'+aux+'\\b','i');
    if(re.test(s)) return s.replace(re, m => m + ' not');
  }
  const numMatch = s.match(/\d[\d,]*/);
  if(numMatch){
    const original = numMatch[0];
    const num = parseInt(original.replace(/,/g,''), 10);
    const delta = Math.max(1, Math.round(num * 0.3));
    const newNum = (num > 5 && Math.random() < 0.5) ? num - delta : num + delta;
    return s.replace(original, String(newNum));
  }
  return null;
}

function genTrueFalse(p, n){
  const bankPicked = pickRandom(p.bank.trueFalse, n);
  const remaining = n - bankPicked.length;
  if(remaining <= 0) return bankPicked;

  const usedStatements = new Set(bankPicked.map(x => x.statement));
  const pool = shuffle(sentencesWithJa(p.textEn, p.textJa).filter(x => isSubstantialSentence(x.en) && !usedStatements.has(x.en)));
  const autoItems = [];
  for(const x of pool){
    if(autoItems.length >= remaining) break;
    if(Math.random() < 0.5){
      autoItems.push({ statement:x.en, answer:true, explanation:'', ja:x.ja });
    } else {
      const falsified = falsifySentence(x.en);
      if(falsified && falsified !== x.en){
        autoItems.push({ statement:falsified, answer:false, explanation:'', ja:x.ja });
      } else {
        autoItems.push({ statement:x.en, answer:true, explanation:'', ja:x.ja });
      }
    }
  }
  return shuffle([...bankPicked, ...autoItems]);
}

/* ---------- long-reading (exam style) generator ---------- */
function buildLongReading(p, blankCount, underlineCount, reorderCount, toEnglishCount){
  const sentences = splitEnglishSentences(p.textEn);
  const pairs = pairSentences(p.textEn, p.textJa);
  const LABELS = 'abcdefghij';

  // fair round-robin allocation so earlier types (blanks/underlines) don't starve later ones (reorder/toEnglish)
  const candidateIdxs = sentences.map((s,i)=>i).filter(i => isSubstantialSentence(sentences[i]));
  const pool = shuffle(candidateIdxs);
  const targetCount = { underline:underlineCount, blank:blankCount, reorder:reorderCount, toEnglish:toEnglishCount };
  const assigned = { underline:[], blank:[], reorder:[], toEnglish:[] };
  let wants = Object.keys(targetCount).filter(k => targetCount[k] > 0);
  let poolPtr = 0;
  while(poolPtr < pool.length && wants.length){
    for(const type of wants.slice()){
      if(poolPtr >= pool.length) break;
      const idx = pool[poolPtr];
      const needsJa = (type === 'underline' || type === 'toEnglish');
      if(needsJa && !pairs[idx]){ poolPtr++; continue; }
      if(type === 'blank' && !pickBlankWord(sentences[idx])){ poolPtr++; continue; }
      assigned[type].push(idx);
      poolPtr++;
      if(assigned[type].length >= targetCount[type]) wants = wants.filter(t => t !== type);
    }
  }

  const underlineSet = new Set(assigned.underline);
  const blankSet = new Set(assigned.blank);
  const reorderSet = new Set(assigned.reorder);
  const toEnglishItems = assigned.toEnglish.sort((a,b)=>a-b).map(i => ({ japanese:pairs[i].ja, answer:pairs[i].en }));

  const blanks = [];
  const underlines = [];
  const reorders = [];
  let blankNum = 0, labelIdx = 0, reorderNum = 0;

  const rendered = sentences.map((s,i)=>{
    const safe = esc(s);
    if(blankSet.has(i)){
      blankNum++;
      const target = pickBlankWord(s);
      const re = new RegExp('\\b'+escapeRegExp(target)+'\\b');
      blanks.push({ num:blankNum, answer:target });
      return safe.replace(re, `<span class="blank-num">(${blankNum})_______</span>`);
    }
    if(underlineSet.has(i)){
      const label = LABELS[labelIdx++];
      underlines.push({ label, english:pairs[i].en, japanese:pairs[i].ja });
      return `<span class="underline-seg">${safe}</span><span class="underline-label">(${label})</span>`;
    }
    if(reorderSet.has(i)){
      reorderNum++;
      const clean = s.replace(/[.?!]+\s*$/,'').trim();
      const words = clean.split(/\s+/);
      let shuffled = shuffle(words);
      if(words.length > 2){
        let tries = 0;
        while(shuffled.join(' ') === words.join(' ') && tries < 5){ shuffled = shuffle(words); tries++; }
      }
      reorders.push({ num:reorderNum, words:shuffled, answer:s });
      return `<span class="reorder-num">(${reorderNum})</span> <span class="reorder-blank-line">_______________________________</span>`;
    }
    return safe;
  });

  return { passageHtml: rendered.join(' '), blanks, underlines, reorders, toEnglishItems };
}

  let html = `<div class="qtype-section"><h4>長文読解</h4><div class="passage-block">${lr.passageHtml}</div>`;
  let qNum = 1;
  if(lr.blanks.length){
    html += `<div class="sub-q">問${qNum++}　空所(1)〜(${lr.blanks.length})に入る最も適切な語を書きなさい。</div>`;
    html += `<div>${lr.blanks.map(b => `<span class="qitem-inline">(${b.num}) ${withAnswer ? `<span class="ans-text">${esc(b.answer)}</span>` : '<span class="answer-line" style="min-width:90px;"></span>'}</span>`).join('')}</div>`;
  }
  if(lr.underlines.length){
    html += `<div class="sub-q">問${qNum++}　下線部${lr.underlines.map(u=>`(${u.label})`).join('')}を日本語に訳しなさい。</div>`;
    html += lr.underlines.map(u => `<div class="qitem"><span class="qn">(${u.label})</span><span class="qbody">${withAnswer ? `<span class="ans-text">${esc(u.japanese)}</span>` : `<div class="answer-line" style="display:block;min-width:100%;height:22px;"></div>`}</span></div>`).join('');
  }
  if(lr.reorders.length){
    html += `<div class="sub-q">問${qNum++}　下線部(1)〜(${lr.reorders.length})の語を並べかえて、意味の通る英文にしなさい。</div>`;
    html += lr.reorders.map(r => questionBody('reorder', { words:r.words, answer:r.answer }, r.num-1, withAnswer)).join('');
  }
  if(lr.toEnglishItems.length){
    html += `<div class="sub-q">問${qNum++}　次の日本語を英語になおしなさい。</div>`;
    html += lr.toEnglishItems.map((item,i) => questionBody('toEnglish', item, i, withAnswer)).join('');
  }
  if(qaItems.length){
    html += `<div class="sub-q">問${qNum++}　次の質問に英語で答えなさい。</div>`;
    html += qaItems.map((item,i) => questionBody('qa', item, i, withAnswer)).join('');
  }
  html += `</div>`;
  return html;
}

const GRADE_ORDER = ['中1','中2','中3'];

/* ---------- selector rendering (grade → program → parts) ---------- */
function renderGradeSelect(){
  const el = document.getElementById('gradeSelect');
  const present = new Set(PROGRAMS.map(p => gradeOf(p.label)));
  const grades = GRADE_ORDER.filter(g => present.has(g));
  el.innerHTML = grades.map(g => `<option value="${g}" ${g===selectedGrade?'selected':''}>${g}</option>`).join('');
  el.addEventListener('change', e=>{
    selectedGrade = e.target.value;
    const first = programsForGrade(selectedGrade)[0];
    selectedProgramLabel = first ? first.label : null;
    renderProgramSelect();
    onProgramChange();
  });
}
function renderProgramSelect(){
  const el = document.getElementById('programSelect');
  const progs = programsForGrade(selectedGrade);
  el.innerHTML = progs.map(p => `<option value="${esc(p.label)}" ${p.label===selectedProgramLabel?'selected':''}>${esc(p.label.replace(selectedGrade+' ',''))}</option>`).join('');
  el.addEventListener('change', e=>{
    selectedProgramLabel = e.target.value;
    onProgramChange();
  });
}
function onProgramChange(){
  const prog = currentProgram();
  if(printMode === 'longReading'){
    selectedParts = new Set(prog && prog.parts[0] ? [prog.parts[0].partLabel] : []);
  } else {
    selectedParts = new Set(prog ? prog.parts.map(pt => pt.partLabel) : []);
  }
  renderPartChecks();
  renderTypeList();
}
function renderPartChecks(){
  const el = document.getElementById('partChecks');
  const prog = currentProgram();
  if(!prog){ el.innerHTML = ''; return; }
  const isSingle = printMode === 'longReading';
  el.innerHTML = prog.parts.map(pt => `
    <div class="part-check-row">
      <label>
        <input type="${isSingle?'radio':'checkbox'}" name="${isSingle?'partSelectRadio':''}" class="part-check" value="${esc(pt.partLabel)}" ${selectedParts.has(pt.partLabel)?'checked':''}>
        ${esc(pt.partLabel)}
      </label>
      <div class="p-badges">
        ${pt.textJa ? '<span class="badge has-ja">和訳あり</span>' : ''}
        ${(pt.qa.length || pt.trueFalse.length) ? `<span class="badge">Q&amp;A${pt.qa.length + pt.trueFalse.length}</span>` : ''}
      </div>
    </div>`).join('');
  el.querySelectorAll('.part-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      if(isSingle){
        selectedParts = new Set(e.target.checked ? [e.target.value] : []);
      } else if(e.target.checked){
        selectedParts.add(e.target.value);
      } else {
        selectedParts.delete(e.target.value);
      }
      renderTypeList();
    });
  });
}

/* ---------- type list ---------- */
function availableCount(t){
  const p = currentPassage();
  if(!p) return 0;
  if(t.key === 'fillBlank') return splitEnglishSentences(p.textEn).filter(s => isSubstantialSentence(s) && pickBlankWord(s)).length;
  if(t.key === 'reorder') return splitEnglishSentences(p.textEn).filter(isSubstantialSentence).length;
  if(t.key === 'trueFalse') return splitEnglishSentences(p.textEn).filter(isSubstantialSentence).length + p.bank.trueFalse.length;
  if(t.mode === 'pair') return pairSentences(p.textEn, p.textJa).filter(x => isSubstantialSentence(x.en)).length;
  return p.bank[t.key].length;
}
function renderTypeList(){
  const el = document.getElementById('typeList');
  const disabledInLongReading = new Set(['trueFalse']);
  el.innerHTML = TYPES.map(t => {
    const isDisabled = printMode === 'longReading' && disabledInLongReading.has(t.key);
    return `
    <div class="type-row ${isDisabled ? 'disabled':''}">
      <label class="tname"><input type="checkbox" data-key="${t.key}" class="type-toggle" ${state[t.key].on?'checked':''} ${isDisabled?'disabled':''}>${t.label}</label>
      <div class="count">
        <span class="avail">/ ${availableCount(t)}件</span>
        <button type="button" class="count-dec" data-key="${t.key}" ${isDisabled?'disabled':''}>−</button>
        <span id="count-${t.key}">${state[t.key].count}</span>
        <button type="button" class="count-inc" data-key="${t.key}" ${isDisabled?'disabled':''}>＋</button>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.type-toggle').forEach(cb=>{
    cb.addEventListener('change', e=>{ state[e.target.dataset.key].on = e.target.checked; });
  });
  document.querySelectorAll('.count-dec').forEach(b=>{
    b.addEventListener('click', ()=>{ const k=b.dataset.key; state[k].count=Math.max(1,state[k].count-1); document.getElementById('count-'+k).textContent=state[k].count; });
  });
  document.querySelectorAll('.count-inc').forEach(b=>{
    b.addEventListener('click', ()=>{ const k=b.dataset.key; state[k].count=Math.min(999,state[k].count+1); document.getElementById('count-'+k).textContent=state[k].count; });
  });
}

/* ---------- worksheet rendering ---------- */
const TYPE_LABEL = {
  fillBlank:'穴埋め問題', reorder:'並べ替え問題', qa:'Q & A（本文読解）',
  trueFalse:'True / False', toJapanese:'日本語訳（英→日）', toEnglish:'英作文（日→英）'
};
function questionBody(key, item, i, withAnswer){
  if(key === 'fillBlank') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody">${esc(item.sentence)}${item.ja?`<div class="ja-hint">${esc(item.ja)}</div>`:''}${withAnswer?`<span class="ans-text"> → ${esc(item.answer)}</span>`:''}</span></div>`;
  if(key === 'reorder') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody"><div class="reorder-words">${(item.words||[]).map(w=>`<span>${esc(w)}</span>`).join('')}</div>${item.ja?`<div class="ja-hint">${esc(item.ja)}</div>`:''}${withAnswer?`<div class="ans-text" style="margin-top:6px;">→ ${esc(item.answer)}</div>`:`<div class="answer-line" style="display:block;min-width:100%;height:1px;margin:10px 0 0;"></div>`}</span></div>`;
  if(key === 'qa') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody">${esc(item.question)}${withAnswer?`<div class="ans-text" style="margin-top:4px;">→ ${esc(item.answer)}</div>`:`<div class="answer-line" style="display:block;min-width:100%;height:22px;margin-top:4px;"></div>`}</span></div>`;
  if(key === 'trueFalse') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody">${esc(item.statement)}${item.ja?`<div class="ja-hint">${esc(item.ja)}</div>`:''}<span class="tf-choice"><span>T</span><span>F</span></span>${withAnswer?`<div class="ans-text" style="margin-top:4px;">→ ${item.answer?'True':'False'}${item.explanation?'（'+esc(item.explanation)+'）':''}</div>`:''}</span></div>`;
  if(key === 'toJapanese') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody">${esc(item.english)}${withAnswer?`<div class="ans-text" style="margin-top:4px;">→ ${esc(item.answer)}</div>`:`<div class="answer-line" style="display:block;min-width:100%;height:22px;margin-top:4px;"></div>`}</span></div>`;
  if(key === 'toEnglish') return `<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody">${esc(item.japanese)}${withAnswer?`<div class="ans-text" style="margin-top:4px;">→ ${esc(item.answer)}</div>`:`<div class="answer-line" style="display:block;min-width:100%;height:22px;margin-top:4px;"></div>`}</span></div>`;
  return '';
}
function sheetHTML(data, title, withAnswer){
  const sections = data.longReading
    ? longReadingSectionHTML(data.longReading, data.longReadingQA || [], withAnswer)
    : Object.keys(TYPE_LABEL).filter(k => Array.isArray(data[k]) && data[k].length).map(k => `
    <div class="qtype-section"><h4>${TYPE_LABEL[k]}</h4>${data[k].map((item,i)=>questionBody(k,item,i,withAnswer)).join('')}</div>`).join('');
  return `
    <div class="sheet ${withAnswer ? 'answer-key' : ''}">
      <div class="sheet-header">
        <div class="title-area"><div class="kicker">${withAnswer?'ANSWER KEY / 解答':'TEST PREP PRINT'}</div><h3>${esc(title)}</h3></div>
        <div class="idbox">
          <div class="cell"><div class="lbl">組</div></div><div class="cell"><div class="lbl">番</div></div><div class="cell"><div class="lbl">点数</div></div>
          <div class="cell" style="grid-column:span 2;"><div class="lbl">氏名</div></div><div class="cell"><div class="lbl">/100</div></div>
        </div>
      </div>
      ${sections}
    </div>`;
}
function renderSheet(data, title){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="toolbar no-print">
      <div class="toggles">
        <label><input type="radio" name="ansMode" value="hidden" checked> 問題のみ（解答なし）</label>
        <label><input type="radio" name="ansMode" value="inline"> 解答も一緒に表示</label>
        <label><input type="radio" name="ansMode" value="separate"> 解答は別紙（2枚目）</label>
      </div>
      <button class="print-btn" id="printBtn">🖨 印刷する</button>
    </div>
    <div id="mainSheetWrap">${sheetHTML(data, title, false)}</div>
    <div id="answerSheetWrap"></div>
    <footer class="credit no-print">配点や表現は印刷前に一度確認してください。</footer>`;
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  document.querySelectorAll('input[name=ansMode]').forEach(r=>{
    r.addEventListener('change', e=>{
      const mode = e.target.value;
      document.getElementById('mainSheetWrap').innerHTML = sheetHTML(data, title, mode === 'inline');
      document.getElementById('answerSheetWrap').innerHTML = mode === 'separate' ? sheetHTML(data, title, true) : '';
    });
  });
}

/* ---------- generate ---------- */
document.getElementById('genBtn').addEventListener('click', ()=>{
  const p = currentPassage();
  const errBox = document.getElementById('errBox');
  errBox.innerHTML = '';
  if(!p){ errBox.innerHTML = '<div class="err">Partを1つ以上選んでください。</div>'; return; }

  if(printMode === 'longReading'){
    const blankN = state.fillBlank.on ? state.fillBlank.count : 0;
    const underlineN = state.toJapanese.on ? state.toJapanese.count : 0;
    const reorderN = state.reorder.on ? state.reorder.count : 0;
    const toEnglishN = state.toEnglish.on ? state.toEnglish.count : 0;
    const qaN = state.qa.on ? state.qa.count : 0;
    if(blankN === 0 && underlineN === 0 && reorderN === 0 && toEnglishN === 0 && qaN === 0){
      errBox.innerHTML = '<div class="err">出題する項目を1つ以上ONにしてください。</div>';
      return;
    }
    if((underlineN > 0 || toEnglishN > 0) && !p.textJa){
      errBox.innerHTML = '<div class="err">下線部訳・英作文を出すには、このProgramに日本語訳を登録してください。</div>';
      return;
    }
    const longReading = buildLongReading(p, blankN, underlineN, reorderN, toEnglishN);
    const data = {
      longReading,
      longReadingQA: pickRandom(p.bank.qa, qaN)
    };
    generatedTitle = p.label + ' 長文読解プリント';
    renderSheet(data, generatedTitle);
    return;
  }

  const selected = TYPES.filter(t => state[t.key].on && state[t.key].count > 0);
  if(selected.length === 0){ errBox.innerHTML = '<div class="err">出題する問題形式を1つ以上選んでください。</div>'; return; }

  const pairs = pairSentences(p.textEn, p.textJa);
  const data = {};
  selected.forEach(t=>{
    const n = state[t.key].count;
    if(t.key === 'fillBlank') data.fillBlank = genFillBlank(p.textEn, p.textJa, n);
    else if(t.key === 'reorder') data.reorder = genReorder(p.textEn, p.textJa, n);
    else if(t.key === 'toJapanese') data.toJapanese = genToJapanese(pairs, n);
    else if(t.key === 'toEnglish') data.toEnglish = genToEnglish(pairs, n);
    else if(t.key === 'trueFalse') data.trueFalse = genTrueFalse(p, n);
    else data[t.key] = pickRandom(p.bank[t.key], n);
  });

  const hasAny = Object.values(data).some(arr => arr && arr.length);
  if(!hasAny){ errBox.innerHTML = '<div class="err">出題できる問題がありません。日本語訳が未登録か、問題バンクが空の可能性があります。</div>'; return; }

  generatedTitle = p.label + ' 定期テスト対策プリント';
  renderSheet(data, generatedTitle);
});

/* ---------- init ---------- */
selectedGrade = GRADE_ORDER.find(g => PROGRAMS.some(p => gradeOf(p.label) === g));
selectedProgramLabel = programsForGrade(selectedGrade)[0].label;
renderGradeSelect();
renderProgramSelect();
onProgramChange();
</script>
