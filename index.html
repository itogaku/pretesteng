<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷りたてドリル | 教科書本文からテスト対策プリント作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F3ED; --panel:#FFFFFF; --ink:#232C36; --ink-soft:#5B6470;
    --rule:#D9D5C7; --rule-strong:#B9B3A0; --red:#B23A2F; --red-soft:#E8CFC9;
    --green:#3B6E52; --green-soft:#D9E6DE; --field:#FCFBF8;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans JP', sans-serif; line-height:1.7; }
  h1,h2,h3{ font-family:'Zen Kaku Gothic New', sans-serif; letter-spacing:.02em; }
  button,select,input{ font-family:inherit; color:var(--ink); }

  .app{ max-width:1320px; margin:0 auto; padding:32px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px)); }
  header.site{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px; padding-bottom:20px; border-bottom:3px solid var(--ink); }
  header.site h1{ font-size:26px; font-weight:900; margin:0; }
  header.site h1 .accent{ color:var(--red); }
  header.site .tagline{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  header.site .stamp{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--green); border:1.5px solid var(--green); border-radius:999px; padding:4px 12px; transform:rotate(-3deg); white-space:nowrap; }

  .layout{ display:grid; grid-template-columns:400px minmax(0,1fr); gap:28px; align-items:start; }
  @media (max-width:960px){ .layout{ grid-template-columns:minmax(0,1fr); } }

  .panel{ background:var(--panel); border:1.5px solid var(--rule-strong); border-radius:4px; padding:22px; position:sticky; top:24px; max-height:calc(100vh - 48px); overflow-y:auto; }
  @media (max-width:960px){ .panel{ position:static; max-height:none; } }
  .panel h2{ font-size:15px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel h2 .num{ display:inline-flex; align-items:center; justify-content:center; width:20px;height:20px; background:var(--ink); color:var(--paper); border-radius:50%; font-size:11px; font-family:'JetBrains Mono',monospace; }
  .panel .hint{ font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; }
  .section-block{ margin-bottom:26px; }

  .grade-tabs{ display:flex; border:1.5px solid var(--rule-strong); border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .grade-tabs button{ flex:1; border:0; background:var(--field); padding:8px 0; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .grade-tabs button+button{ border-left:1.5px solid var(--rule-strong); }
  .grade-tabs button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }

  .prog{ border:1px solid var(--rule-strong); border-radius:3px; margin-bottom:6px; background:var(--field); }
  .prog > .prog-h{ display:flex; align-items:center; gap:8px; padding:7px 10px; }
  .prog > .prog-h label{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer; font-size:13px; }
  .prog > .prog-h .pt{ font-weight:700; white-space:nowrap; }
  .prog > .prog-h .pttl{ color:var(--ink-soft); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prog .open-btn{ border:1px solid var(--rule-strong); background:#fff; border-radius:3px; font-size:11px; padding:1px 7px; cursor:pointer; white-space:nowrap; }
  .prog .parts{ display:none; padding:0 10px 8px 34px; }
  .prog.open .parts{ display:block; }
  .part-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px 0; border-top:1px dashed var(--rule); }
  .part-row label{ display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; flex:1; min-width:0; }
  .part-row .ptl{ color:var(--ink-soft); font-size:11.5px; }
  .badge{ font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--ink-soft); border:1px solid var(--rule-strong); border-radius:3px; padding:1px 5px; white-space:nowrap; }
  input[type=checkbox], input[type=radio]{ accent-color:var(--red); width:16px; height:16px; flex:none; cursor:pointer; margin:0; }
  .sel-summary{ font-size:11.5px; color:var(--green); margin-top:6px; }
  .linkbtn{ border:0; background:none; color:var(--red); font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; }

  .mode-toggle{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; border:1px solid var(--rule-strong); border-radius:3px; padding:10px 12px; margin-bottom:12px; background:var(--field); }
  .mode-toggle label{ display:flex; align-items:center; gap:8px; cursor:pointer; }

  .type-row{ padding:9px 0; border-bottom:1px dashed var(--rule); }
  .type-row:last-child{ border-bottom:none; }
  .type-main{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .type-row label.tname{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
  .type-row .tdesc{ font-size:10.5px; color:var(--ink-soft); }
  .count{ display:flex; align-items:center; gap:6px; flex:none; }
  .count button{ width:22px;height:22px; border:1px solid var(--rule-strong); background:#fff; border-radius:3px; font-size:13px; cursor:pointer; line-height:1; }
  .count button:hover{ background:var(--paper); }
  .count span.n{ font-family:'JetBrains Mono',monospace; font-size:12.5px; width:20px; text-align:center; }
  .count .avail{ font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
  .type-opts{ display:flex; flex-wrap:wrap; gap:4px 12px; padding:4px 0 0 24px; font-size:11.5px; color:var(--ink-soft); }
  .type-opts label{ display:flex; align-items:center; gap:4px; cursor:pointer; }
  .type-opts select{ border:1px solid var(--rule-strong); border-radius:3px; background:var(--field); font-size:11.5px; padding:1px 3px; }
  .type-opts input[type=checkbox]{ width:13px; height:13px; }
  .type-row.off .type-opts, .type-row.off .count{ opacity:.45; }
  .type-row.disabled{ opacity:.35; pointer-events:none; }

  .title-input{ width:100%; border:1.5px solid var(--rule-strong); border-radius:3px; padding:8px; font-size:13px; background:var(--field); }
  .generate-btn{ width:100%; padding:13px; background:var(--ink); color:var(--paper); border:none; border-radius:3px; font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:.03em; }
  .generate-btn:hover{ background:#3a4552; }
  .err{ margin-top:10px; font-size:12.5px; color:var(--red); background:var(--red-soft); border:1px solid var(--red); border-radius:3px; padding:8px 10px; }
  button:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--red); outline-offset:1px; }

  .stage{ min-height:400px; min-width:0; }
  .empty-state{ border:2px dashed var(--rule-strong); border-radius:4px; padding:60px 30px; text-align:center; color:var(--ink-soft); background:var(--panel); }
  .empty-state .big{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:16px; color:var(--ink); margin-bottom:6px; }
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar .toggles{ display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); }
  .toolbar label{ display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
  .toolbar .btns{ display:flex; gap:8px; }
  .re-btn{ padding:9px 14px; background:#fff; border:1.5px solid var(--ink); border-radius:3px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  .print-btn{ padding:9px 18px; background:var(--red); color:#fff; border:none; border-radius:3px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  .print-btn:hover{ background:#963026; }

  /* ---------- sheet ---------- */
  .sheet{ background:#fff; border:1px solid var(--rule-strong); box-shadow:0 2px 10px rgba(0,0,0,.06); padding:34px 38px; margin-bottom:22px; }
  @media (max-width:600px){ .sheet{ padding:20px 16px; } }
  .sheet-header{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; padding-bottom:14px; margin-bottom:22px; border-bottom:2.5px solid var(--ink); }
  @media (max-width:600px){ .sheet-header{ grid-template-columns:minmax(0,1fr); } }
  .sheet-header .kicker{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .sheet-header h3{ margin:2px 0 0; font-size:20px; text-wrap:balance; }
  .sheet-header .range{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .idbox{ display:grid; grid-template-columns:repeat(3,72px); border:1.3px solid var(--ink); align-self:start; }
  .idbox .cell{ border-right:1.3px solid var(--ink); border-bottom:1.3px solid var(--ink); padding:4px 6px; min-height:30px; }
  .idbox .cell:nth-child(3), .idbox .cell:last-child{ border-right:none; }
  .idbox .cell:nth-last-child(-n+2){ border-bottom:none; }
  .idbox .cell .lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--ink-soft); }

  .qtype-section{ margin-bottom:26px; }
  .qtype-section h4{ font-size:13.5px; margin:0 0 6px; padding:5px 10px; background:var(--ink); color:var(--paper); display:inline-block; border-radius:2px; }
  .qtype-section .inst{ font-size:12.5px; margin:0 0 12px; }
  .qitem{ display:flex; gap:10px; margin-bottom:14px; font-size:13.5px; break-inside:avoid; }
  .qitem .qn{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--red); min-width:24px; }
  .qitem .qbody{ flex:1; min-width:0; }
  .en{ font-size:14px; }
  .sp{ font-weight:700; margin-right:5px; }
  .ja-hint{ color:var(--ink-soft); font-size:12px; margin-top:3px; }
  .blank{ display:inline-block; min-width:88px; border-bottom:1px solid var(--ink); margin:0 3px; color:var(--ink-soft); font-size:11px; line-height:1.2; }
  .blank.short{ min-width:60px; }
  .answer-line{ display:block; border-bottom:1px solid var(--ink); height:26px; }
  .answer-line.half{ height:22px; }
  .reorder-words{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:center; }
  .reorder-words span.w{ border:1px solid var(--rule-strong); border-radius:3px; padding:2px 9px; font-size:13px; background:var(--paper); }
  .reorder-words .fixed{ font-weight:700; }
  .tf-choice{ display:inline-flex; gap:14px; margin-left:10px; font-family:'JetBrains Mono',monospace; font-size:12.5px; white-space:nowrap; }
  .tf-choice span{ border:1px solid var(--ink-soft); border-radius:50%; padding:2px 8px; }
  .wordbank{ border:1px solid var(--ink); padding:6px 12px; margin:0 0 12px; font-size:13px; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .vgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 28px; }
  @media (max-width:600px){ .vgrid{ grid-template-columns:minmax(0,1fr); } }
  .vgrid .qitem{ align-items:flex-end; margin-bottom:10px; }
  .vgrid .vw{ display:flex; gap:8px; align-items:flex-end; }
  .vgrid .vw .answer-line{ flex:1; min-width:60px; height:22px; }
  .hintc{ color:var(--ink-soft); font-size:12px; }
  .read-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 22px; font-size:13px; }
  .read-grid > div{ border-bottom:1px dotted var(--rule-strong); padding-bottom:3px; }
  .read-check{ display:flex; gap:6px; align-items:center; font-size:12px; margin:0 0 10px; }
  .read-check i{ width:18px; height:18px; border:1.3px solid var(--ink); display:inline-block; }
  .part-cap{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px; margin:10px 0 6px; border-left:4px solid var(--ink); padding-left:8px; }

  .passage-block{ border:1px solid var(--rule-strong); border-radius:3px; background:var(--paper); padding:14px 18px; font-size:13.5px; line-height:1.9; margin-bottom:16px; }
  .passage-block p{ margin:0 0 6px; text-indent:1em; }
  .passage-block .dl{ display:block; padding-left:5.5em; text-indent:-5.5em; }
  .blank-num{ color:var(--red); font-weight:700; }
  .underline-seg{ text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:1.5px; text-underline-offset:3px; }
  .underline-label{ color:var(--red); font-size:10px; font-weight:700; margin:0 2px; }
  .reorder-num{ color:var(--red); font-weight:700; }
  .toeng-num{ color:var(--green); font-weight:700; }
  .reorder-blank-line{ color:var(--rule-strong); letter-spacing:1px; }
  .sub-q{ margin:16px 0 8px; font-size:13px; font-weight:700; }
  .qitem-inline{ display:inline-block; margin:0 16px 8px 0; font-size:12.5px; }

  .answer-key .sheet-header{ border-bottom-color:var(--green); }
  .answer-key .kicker{ color:var(--green); }
  .answer-key .qn{ color:var(--green); }
  .ans-text{ color:var(--green); font-weight:600; }
  .sheet-foot{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:6px; margin-top:10px; }
  footer.credit{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }

  @media print{
    @page{ size:A4; margin:14mm 13mm; }
    body{ background:#fff; }
    .no-print{ display:none !important; }
    .app{ padding:0; max-width:none; }
    .layout{ display:block; }
    .sheet{ box-shadow:none; border:none; padding:0; margin:0; }
    .sheet + .sheet, .answer-key{ break-before:page; }
    .qtype-section h4{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .qtype-section h4, .inst{ break-after:avoid; }
    .passage-block{ break-inside:avoid; }
  }
  /* ---------- v2: panel ---------- */
  .main-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .main-grid label{ display:flex; align-items:center; gap:7px; border:1px solid var(--rule-strong); border-radius:3px; padding:7px 9px; font-size:12.5px; cursor:pointer; background:var(--field); }
  .main-grid label:has(input:checked){ border-color:var(--ink); background:#fff; box-shadow:inset 3px 0 0 var(--red); font-weight:700; }
  .main-grid label.wide{ grid-column:span 2; }
  .opt-box{ margin-top:10px; border:1px dashed var(--rule-strong); border-radius:3px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; font-size:12.5px; }
  .opt-box:empty{ display:none; }
  .opt-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .opt-row > span.lab{ color:var(--ink-soft); min-width:5.5em; font-size:12px; }
  .seg-sm{ display:inline-flex; border:1px solid var(--rule-strong); border-radius:3px; overflow:hidden; }
  .seg-sm button{ border:0; background:#fff; padding:3px 9px; font-size:12px; cursor:pointer; }
  .seg-sm button + button{ border-left:1px solid var(--rule-strong); }
  .seg-sm button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
  .opt-row label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .opt-row input[type=checkbox]{ width:14px; height:14px; }
  .opt-note{ font-size:11px; color:var(--ink-soft); }
  .extra-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--rule); }
  .extra-row:last-child{ border-bottom:0; }
  .extra-row label.tname{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
  .extra-sub{ display:flex; gap:10px; padding:0 0 6px 24px; font-size:11.5px; color:var(--ink-soft); }
  .extra-sub select{ border:1px solid var(--rule-strong); border-radius:3px; background:var(--field); font-size:11.5px; }
  .extra-sub input{ width:13px; height:13px; }
  .is-off{ opacity:.45; }

  /* ---------- v2: toolbar edit ---------- */
  .edit-btn{ padding:9px 14px; background:#fff; border:1.5px solid var(--green); color:var(--green); border-radius:3px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  .edit-btn[aria-pressed="true"]{ background:var(--green); color:#fff; }
  .edit-note{ width:100%; font-size:12px; color:var(--green); background:var(--green-soft); border:1px solid var(--green); border-radius:3px; padding:7px 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .edit-note button{ border:0; background:none; color:var(--red); text-decoration:underline; cursor:pointer; font-size:12px; padding:0; }
  .tk{ cursor:pointer; border-radius:2px; padding:0 1px; outline:1px dashed transparent; }
  .tk:hover{ outline-color:var(--green); background:var(--green-soft); }
  .tk.on{ background:var(--red-soft); color:var(--red); font-weight:700; text-decoration:underline; }
  .tk.manual-mark{ }
  .row-edited .qn::after{ content:"✎"; font-size:9px; color:var(--green); margin-left:2px; }

  /* ---------- v2: sheet rows ---------- */
  .row{ display:grid; grid-template-columns:26px minmax(0,1fr); gap:6px; margin-bottom:9px; font-size:13.5px; break-inside:avoid; }
  .row .qn{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--red); font-size:12.5px; padding-top:1px; }
  .row.plain .qbody{ color:var(--ink-soft); }
  .row .ja-hint{ margin-top:1px; }
  .row .answer-line{ height:24px; }
  .tiles{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; align-items:flex-end; }
  .tile{ display:inline-flex; flex-direction:column; align-items:center; border:1px solid var(--rule-strong); border-radius:3px; padding:2px 8px 2px; background:var(--paper); font-size:13px; line-height:1.35; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .tile .g{ font-size:9.5px; color:var(--ink-soft); line-height:1.2; margin-top:1px; min-height:1.2em; font-family:'Noto Sans JP',sans-serif; }
  .tile.fixed{ background:#fff; border-style:dashed; font-weight:700; }
  .tiles .end{ font-size:14px; padding:0 2px 3px; }
  .ans-full b{ text-decoration:underline; color:var(--red); }
  .answer-key .ans-full b{ color:var(--green); }
  /* ---------- v3: 文の要素 ---------- */
  :root{
    --r-subj:#2F5D9A; --r-subj-bg:#DCE6F4;
    --r-verb:#B23A2F; --r-verb-bg:#F3D9D5;
    --r-obj:#3B6E52;  --r-obj-bg:#D9E6DE;
    --r-comp:#6B4C9A; --r-comp-bg:#E6DDF2;
    --r-mod:#7A6A4F;  --r-mod-bg:#EEE8DC;
    --r-conj:#2F7C83; --r-conj-bg:#D7ECEE;
    --r-oth:#7B818A;  --r-oth-bg:#ECEDEF;
  }
  .rblocks{ display:flex; flex-wrap:wrap; gap:4px 3px; align-items:flex-start; margin-top:2px; }
  .rb{ display:inline-flex; flex-direction:column; align-items:center; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rb .rt{ border:1.3px solid var(--rc); background:var(--rbg); border-radius:3px; padding:1px 7px; font-size:13.5px; line-height:1.5; }
  .rb .rl{ font-size:9.5px; color:var(--rc); font-weight:700; line-height:1.25; margin-top:1px; white-space:nowrap; }
  .rb .rg{ font-size:9px; color:var(--ink-soft); line-height:1.2; white-space:nowrap; }
  .rb.mono .rt{ background:#fff; border-color:var(--ink-soft); }
  .rb.mono .rl{ color:var(--ink); }
  .rb.blank .rl{ align-self:stretch; min-width:3.2em; height:17px; border-bottom:1px solid var(--ink); font-size:0; margin:0 2px; }
  .rb.blank .rt{ border-color:var(--rule-strong); }
  .rb.given .rt{ color:var(--ink-soft); border:1px dashed var(--rule-strong); }
  .rb.given .rl{ color:var(--ink-soft); font-weight:400; }
  .amb-note{ font-size:9.5px; color:var(--ink-soft); margin-left:6px; }
  .sp-line{ display:flex; gap:6px; align-items:flex-start; }
  .sp-line > .sp{ padding-top:3px; font-size:12.5px; white-space:nowrap; }
  .seg-sm button{ white-space:nowrap; }
  .r-主語{ --rc:var(--r-subj); --rbg:var(--r-subj-bg); }
  .r-動詞{ --rc:var(--r-verb); --rbg:var(--r-verb-bg); }
  .r-目的語{ --rc:var(--r-obj); --rbg:var(--r-obj-bg); }
  .r-補語{ --rc:var(--r-comp); --rbg:var(--r-comp-bg); }
  .r-修飾語{ --rc:var(--r-mod); --rbg:var(--r-mod-bg); }
  .r-接続詞{ --rc:var(--r-conj); --rbg:var(--r-conj-bg); }
  .r-その他{ --rc:var(--r-oth); --rbg:var(--r-oth-bg); }
  .r-先行詞{ --rc:#55606E; --rbg:#E9ECEF; }
  .rb.nest > .rt{ display:flex; flex-wrap:wrap; gap:3px; padding:3px 4px 2px; background:#fff; border-width:1.6px; }

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
let rnd = Math.random;
function withRng(r, fn){ const prev=rnd; rnd=r; try{ return fn(); } finally{ rnd=prev; } }
function esc(s){ return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickRandom(arr,n){ return shuffle(arr).slice(0, Math.max(0, Math.min(n, arr.length))); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem('suritate:'+k)); localStorage.setItem('suritate:'+k, JSON.stringify(v)); }catch(e){ return null; } }

const TOK = /[A-Za-z0-9]+(?:['\-.][A-Za-z0-9]+)*|[^\sA-Za-z0-9]/g;
const tokens = s => s.match(TOK) || [];
const isWord = t => /^[A-Za-z0-9]/.test(t);
const wordCount = s => tokens(s).filter(isWord).length;
function joinTokens(ts, disp){
  disp = disp || ts.map(esc);
  let out='', q=0;
  ts.forEach((t,i)=>{
    const prev = ts[i-1];
    let space = i>0;
    if(/^[.,!?;:)\]%]$/.test(t)) space=false;
    if(prev==='(' || prev==='[' || prev==='$') space=false;
    if(t==='"'){ space = (q%2===0) && i>0; q++; }
    else if(prev==='"' && q%2===1) space=false;
    out += (space?' ':'') + disp[i];
  });
  return out;
}

  return `<span class="seg-sm" data-path="${path}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</span>`;
}
function chk(path, label){ const [a,b]=path.split('.'); return `<label><input type="checkbox" data-path="${path}" ${S[a][b]?'checked':''}>${label}</label>`; }
function num(path){ const [a,b]=path.split('.'); return `<span class="count"><button type="button" data-num="${path}" data-d="-1" aria-label="減らす">−</button><span class="n">${S[a][b]}</span><button type="button" data-num="${path}" data-d="1" aria-label="増やす">＋</button></span>`; }

    case 'order':
      h = `<div class="opt-row"><span class="lab">分け方</span>${seg('order.unit',[['w','1語ずつ'],['s','小さめ'],['l','大きめ'],['r','文の要素']])}</div>
        <div class="opt-row">${chk('order.gloss','語句の下に日本語の意味')}${S.order.unit==='r'?chk('order.role','役割名（主語・動詞…）を表示'):''}${chk('order.ja','文の和訳を表示')}</div>
        <div class="opt-row">${chk('order.first','最初の語句を示す')}</div>`; break;
    case 'j2e':

        <div class="opt-note">形が変わる語がない文は、そのまま表示されます。</div>`; break;

        ${S.copy.kind==='roles'?`<div class="opt-row">${chk('copy.nest','節の中（主語・動詞…）も示す')}</div><div class="opt-note">本文を主語・動詞・目的語…のブロックに分け、色とラベルで示します（予習・解説用）。</div>`:''}`; break;

        <div class="opt-row">${chk('parse.nest','節の中（主語・動詞…）も分ける')}${chk('parse.ja','各文の和訳を添える')}</div>

    } else {
      h += ['qa','tf'].map(k=>{ const x=EXTRAS.find(e=>e.key===k), s=S.extras[k]; const avail = parts.length ? extraPool(k,parts).length : 0;
        return `<div class="extra-row"><label class="tname"><input type="checkbox" data-x="${k}" ${s.on?'checked':''}>${x.label}</label>
          <div class="count"><span class="avail">/ ${avail}件</span><button type="button" data-xn="${k}" data-d="-1" aria-label="減らす">−</button><span class="n">${s.count}</span><button type="button" data-xn="${k}" data-d="1" aria-label="増やす">＋</button></div></div>
          ${k==='qa'?`<div class="extra-sub"><label><input type="checkbox" data-xo="qa.qj" ${s.qj?'checked':''}> 質問の和訳を添える</label></div>`:''}`; }).join('');
    }

    const s=S.extras.vocab; const avail = parts.length ? extraPool('vocab',parts).length : 0;

      <div class="opt-row"><span class="lab">向き</span><select data-xo="vocab.dir">${[['mix','英⇄日 両方'],['e2j','英→日'],['j2e','日→英']].map(([v,l])=>`<option value="${v}" ${s.dir===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="opt-note">選んだ範囲の新出語（ガイドの単語・語句）から出題します。</div></div>`;
  }
  bindOpts(body, renderCat);
  body.querySelectorAll('input[data-x]').forEach(cb=>cb.addEventListener('change',()=>{ S.extras[cb.dataset.x].on=cb.checked; save(); }));
  body.querySelectorAll('button[data-xn]').forEach(b=>b.addEventListener('click',()=>{ const s=S.extras[b.dataset.xn]; s.count=Math.max(1,Math.min(60,s.count+(+b.dataset.d))); save(); renderCat(); }));

function bindOpts(root, rerender){
  root.querySelectorAll('.seg-sm').forEach(sg=>sg.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const [a,k]=sg.dataset.path.split('.'); S[a][k]=b.dataset.v; save(); rerender(); }));

  root.querySelectorAll('button[data-num]').forEach(b=>b.addEventListener('click',()=>{ const [a,k]=b.dataset.num.split('.'); S[a][k]=Math.max(0,Math.min(20,S[a][k]+(+b.dataset.d))); save(); rerender(); }));
}
/* ================= helpers ================= */
function sentPool(parts){ const out=[]; parts.forEach(({g,p,pt})=>pt.sentences.forEach((s,si)=>out.push(Object.assign({_pt:pt,_p:p,_g:g,_key:sentKey(g,p,pt,si)},s)))); return out; }
const spk = s => s.sp ? `<span class="sp">${esc(s.sp)}:</span>` : '';
function vocabSet(pt){ if(pt._vs) return pt._vs; const s=new Set(); (pt.vocab||[]).forEach(v=>v.w.toLowerCase().replace(/[()~〜,]/g,' ').split(/\s+/).forEach(x=>x&&s.add(x))); return pt._vs=s; }
function blankCandidates(s){
  const ts=tokens(s.en), vs=vocabSet(s._pt||{vocab:[]}), out=[];
  ts.forEach((t,i)=>{ if(!/^[A-Za-z]/.test(t) || t.length<2) return; if(NAMES.has(t)) return;
    const w=t.toLowerCase(); if(NEVER_BLANK.has(w) && !vs.has(w)) return;
    let wt = STOPWORDS.has(w) ? 0.15 : (t.length>=4 ? 2 : 0.8); if(vs.has(w)) wt=6; out.push({i,wt}); });
  return out;
}
function weightedPickN(c,n){ const pool=c.slice(), out=[]; while(out.length<n && pool.length){ const tot=pool.reduce((a,b)=>a+b.wt,0); let x=rnd()*tot, k=0; for(;k<pool.length-1;k++){ x-=pool[k].wt; if(x<=0) break; } out.push(pool[k].i); pool.splice(k,1); } return out.sort((a,b)=>a-b); }
function weighted(c){ return c.length ? {i:weightedPickN(c,1)[0]} : null; }
function scramble(items, same){ let sh=shuffle(items); for(let k=0;k<8 && items.length>1 && same(sh);k++) sh=shuffle(items); return sh; }
function sRng(key){ return mulberry32(hashStr(seed+'#'+key)); }
function partCaption(p,pt){ return `<div class="part-cap">${esc(p.program)} ${esc(pt.id)}${pt.title?'　'+esc(pt.title):''}</div>`; }

/* chunks for 並べ替え: returns [{text, gloss}] in correct order + end punctuation */
function chunksOf(s, unit){
  const ts=tokens(s.en); const end = /^[.?!]$/.test(ts[ts.length-1]) ? ts[ts.length-1] : '';
  const words = []; ts.forEach((t,i)=>{ if(isWord(t)) words.push(t); else if(t==="'" && i>0 && isWord(ts[i-1]) && /s$/i.test(ts[i-1]) && words.length) words[words.length-1]+="'"; });
  const lc = (w,i)=> i===0 && !NAMES.has(w) && !/^I'/.test(w) && !/^[A-Z]{2,}/.test(w) ? w.toLowerCase() : w;
  const g = s.g && s.g.w && s.g.w.length===words.length ? s.g : null;
  const numJoin = i => i>0 && /^\d+$/.test(words[i-1]) && /^\d{3}$/.test(words[i]) && s.en.includes(words[i-1]+','+words[i]);
  let spans;
  if(unit==='w' || !g){ spans=[]; words.forEach((_,i)=>{ if(numJoin(i) && spans.length){ spans[spans.length-1][1]=i; if(g) spans[spans.length-1][2]= g.w[i] ? g.w[i-1]+','+g.w[i] : g.w[i-1]; } else spans.push([i,i, g ? g.w[i] : '']); }); }
  else if(unit==='r' && s.r && s.r.length && s.r[s.r.length-1][1]===words.length-1) spans = s.r.map(([a,b,role,note,gl])=>[a,b,gl,role,note]);
  else spans = (unit==='l' || unit==='r' ? g.l : g.s).map(x=>x.slice());
  const txt=(a,b)=>{ let t=''; for(let i=a;i<=b;i++){ t += (i===a?'':(numJoin(i)?',':' ')) + lc(words[i],i); } return t; };
  return { end, chunks: spans.map(([a,b,gl,role,note])=>({ text: txt(a,b), gloss: gl||'', role: role||'', note: note||'' })) };
}

/* 文の要素 blocks: [{html, role, note, gloss}] using tokens so punctuation stays in place */
const ROLES=['主語','動詞','目的語','補語','修飾語','接続詞','その他','先行詞'];
function roleBlocks(s){
  if(!s.r || !s.r.length) return null;
  const ts=tokens(s.en); const wt=[]; ts.forEach((t,i)=>{ if(isWord(t)) wt.push(i); });
  if(s.r[s.r.length-1][1]!==wt.length-1) return null;
  const endTok = /^[.?!]$/.test(ts[ts.length-1]) ? ts.length-1 : ts.length;
  return s.r.map(([a,b,role,note,gloss],k)=>{
    const t0 = k===0 ? 0 : wt[a];
    const t1 = k===s.r.length-1 ? endTok-1 : wt[s.r[k+1][0]]-1;
    return { text: joinTokens(ts.slice(t0,t1+1)), role: ROLES.includes(role)?role:'その他', note:note||'', gloss:gloss||'', a, b };
  }).concat(endTok<ts.length ? [{end:ts[endTok]}] : []);
}
const SUBJ_CONTR=/^(I|you|he|she|it|we|they|that|this)'(m|re|s|ll|ve|d)$/i;
function subBlocks(s, k, a0, b0){
  const ts=tokens(s.en); const wt=[]; ts.forEach((t,i)=>{ if(isWord(t)) wt.push(i); });
  const endTok = /^[.?!]$/.test(ts[ts.length-1]) ? ts.length-1 : ts.length;
  const sub = s.rc[k].sub;
  return sub.map(([a,b,role,note],j)=>{
    const t0 = a===0 ? 0 : wt[a];
    const t1 = (b+1<wt.length) ? wt[b+1]-1 : endTok-1;
    return { text: joinTokens(ts.slice(t0,t1+1)), role: ROLES.includes(role)?role:'その他', note:note||'' };
  });
}
const hasNest = (s,k)=> s.rc && s.rc[k] && !s.rc[k].amb;
function roleLabel(b){ const plain=(b.text||'').replace(/<[^>]*>/g,'').trim();
  if((b.role==='主語'||b.role==='動詞') && SUBJ_CONTR.test(plain)) return '主語＋動詞';
  return b.role + (b.note && b.role==='修飾語' ? `（${b.note}）` : ''); }
function roleHTML(s, mode, nest){ // mode: 'color' | 'blank' (show boxes, empty labels); nest: show clause insides
  const bl=roleBlocks(s); if(!bl) return `<div class="en">${esc(s.en)}</div>`;
  const given=new Set(s.rg||[]);
  const inner = (b,k)=> subBlocks(s,k).map(x=> mode==='blank' ? `<span class="rb mono blank"><span class="rt">${x.text}</span><span class="rl"></span></span>` : `<span class="rb r-${x.role}"><span class="rt">${x.text}</span><span class="rl">${roleLabel(x)}${x.note&&x.role!=='修飾語'?'（'+esc(x.note)+'）':''}</span></span>`).join('');
  return `<div class="rblocks">${bl.map((b,k)=> b.end!==undefined ? `<span class="end" style="font-size:14px;padding-top:2px">${esc(b.end)}</span>` :
    nest && hasNest(s,k) ? (mode==='blank' ? `<span class="rb nest mono blank"><span class="rt">${inner(b,k)}</span><span class="rl"></span></span>` : `<span class="rb nest r-${b.role}"><span class="rt">${inner(b,k)}</span><span class="rl">${roleLabel(b)}</span></span>`) :
    mode==='blank' && given.has(k) ? `<span class="rb mono given"><span class="rt">${b.text}</span><span class="rl">${roleLabel(b)}</span></span>` :
    mode==='blank' ? `<span class="rb mono blank"><span class="rt">${b.text}</span><span class="rl"></span></span>`
                   : `<span class="rb r-${b.role}"><span class="rt">${b.text}</span><span class="rl">${roleLabel(b)}</span></span>`).join('')}</div>`;
}
const ROLE_LEGEND = `<div class="r-legend">${ROLES.filter(r=>r!=='先行詞').concat(['先行詞']).map(r=>`<span class="rb r-${r}"><span class="rt">${r}</span></span>`).join('')}</div>`;

/* ================= main generators: every sentence, in order ================= */
const MAIN_GEN = {
  fill(parts){
    const o=S.fill; let n=0; const bank=[]; const rows=[], ans=[];
    parts.forEach(({g,p,pt},pi)=>{
      if(parts.length>1 || true) rows.push(partCaption(p,pt)), ans.push(partCaption(p,pt));
      pt.sentences.forEach((s0,si)=>{
        const s=Object.assign({_pt:pt},s0); const k=sentKey(g,p,pt,si); const ts=tokens(s.en);
        let idx; const manual = Object.prototype.hasOwnProperty.call(overrides,k);
        if(manual) idx = overrides[k].filter(i=>i<ts.length);
        else { const c=blankCandidates(s); const wc=ts.filter(isWord).length; const want = o.per==='r30' ? Math.max(1,Math.round(wc*0.3)) : +o.per;
          idx = withRng(sRng(k), ()=>weightedPickN(c, want)); }
        const set=new Set(idx);
        lastBuild.fillChoice[k]=idx;
        let body;
        if(editMode){
          body = joinTokens(ts, ts.map((t,i)=> isWord(t) ? `<span class="tk ${set.has(i)?'on':''}" data-k="${esc(k)}" data-i="${i}">${esc(t)}</span>` : esc(t)));
        } else {
          body = joinTokens(ts, ts.map((t,i)=> set.has(i) ? `<span class="blank ${t.length<4?'short':''}">${o.hint==='first'?esc(t[0]):''}</span>` : esc(t)));
        }
        idx.forEach(i=>bank.push(ts[i]));
        const numbered = set.size>0; if(numbered) n++;
        rows.push(`<div class="row ${numbered?'':'plain'} ${manual?'row-edited':''}"><span class="qn">${numbered?n+'.':''}</span><div class="qbody"><div class="en">${spk(s)}${body}</div>${o.ja&&s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`);
        if(numbered) ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody ans-full">${spk(s)}${joinTokens(ts, ts.map((t,i)=>set.has(i)?`<b>${esc(t)}</b>`:esc(t)))}</div></div>`);
      });
    });
    const pre = (o.hint==='bank' && bank.length && !editMode) ? `<div class="wordbank">${withRng(mulberry32(seed), ()=>shuffle(bank)).map(w=>`<span>${esc(w)}</span>`).join('')}</div>` : '';
    return { title:'穴埋め', inst:'本文の内容に合うように、空欄に適する英語を1語ずつ書きなさい。', body: pre+rows.join(''), ans: ans.join('') };
  },
  order(parts){
    const o=S.order; let n=0; const rows=[], ans=[];
    parts.forEach(({g,p,pt})=>{
      rows.push(partCaption(p,pt)); ans.push(partCaption(p,pt));
      pt.sentences.forEach((s,si)=>{
        const k=sentKey(g,p,pt,si); const {end, chunks}=chunksOf(s, o.unit);
        if(chunks.length<2){ rows.push(`<div class="row plain"><span class="qn"></span><div class="qbody"><div class="en">${spk(s)}${esc(s.en)}</div>${o.ja&&s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`); return; }
        n++;
        let fixed=null, rest=chunks; if(o.first){ fixed=chunks[0]; rest=chunks.slice(1); }
        const sh = rest.length>1 ? withRng(sRng(k), ()=>scramble(rest, a=>a.every((c,i)=>c===rest[i]))) : rest;
        const showRole = o.unit==='r' && o.role && s.rs!=='amb';
        const tile = (c,cls='')=>`<span class="tile ${cls} ${showRole&&c.role?'r-'+c.role:''}" ${showRole&&c.role?'style="border-color:var(--rc)"':''}><span>${esc(c.text)}</span>${showRole&&c.role?`<span class="rlab" style="color:var(--rc)">${esc(roleLabel(c))}</span>`:''}${o.gloss?`<span class="g">${esc(c.gloss)}</span>`:''}</span>`;
        rows.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody">${o.ja&&s.ja?`<div>${s.sp?`<span class="sp">${esc(s.sp)}:</span>`:''}${esc(s.ja)}</div>`:(s.sp?`<div><span class="sp">${esc(s.sp)}:</span></div>`:'')}
          <div class="tiles">${fixed?tile(fixed,'fixed'):''}${sh.map(c=>tile(c)).join('')}<span class="end">${esc(end)}</span></div><div class="answer-line"></div></div></div>`);
        ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody ans-text">${spk(s)}${esc(s.en)}</div></div>`);
      });
    });
    return { title:'並べ替え', inst: S.order.ja ? '日本語に合うように、語句を並べかえて全文を書きなさい。（文頭の語も小文字にしてあります）' : '意味の通る英文になるように、語句を並べかえて全文を書きなさい。（文頭の語も小文字にしてあります）', body:rows.join(''), ans:ans.join('') };
  },
  e2j(parts){
    let n=0; const rows=[], ans=[];
    parts.forEach(({p,pt})=>{ rows.push(partCaption(p,pt)); ans.push(partCaption(p,pt));
      pt.sentences.forEach(s=>{ n++; rows.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody"><div class="en">${spk(s)}${esc(s.en)}</div><div class="answer-line"></div></div></div>`);
        ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody ans-text">${esc(s.ja)}</div></div>`); }); });
    return { title:'和訳（英→日）', inst:'次の英文を日本語に直しなさい。', body:rows.join(''), ans:ans.join('') };
  },
  j2e(parts){
    const o=S.j2e; let n=0; const rows=[], ans=[];
    parts.forEach(({p,pt})=>{ rows.push(partCaption(p,pt)); ans.push(partCaption(p,pt));
      pt.sentences.forEach(s=>{ n++; const first=tokens(s.en).find(isWord)||'';
        const h = o.hint==='count' ? ` <span class="hintc">（${wordCount(s.en)}語）</span>` : o.hint==='first' ? ` <span class="hintc">（${esc(first)} で始める）</span>` : '';
        rows.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody"><div>${s.sp?`<span class="sp">${esc(s.sp)}:</span>`:''}${esc(s.ja)}${h}</div><div class="answer-line"></div></div></div>`);
        ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody ans-text">${esc(s.en)}</div></div>`); }); });
    return { title:'英訳（日→英）', inst:'次の日本語を英語に直しなさい。（本文の英文を書きます）', body:rows.join(''), ans:ans.join('') };
  },
  form(parts){
    const o=S.form; let n=0; const rows=[], ans=[];
    parts.forEach(({g,p,pt})=>{ rows.push(partCaption(p,pt)); ans.push(partCaption(p,pt));
      pt.sentences.forEach((s,si)=>{ const ts=tokens(s.en); const k=sentKey(g,p,pt,si);
        const cand = (s.f||[]).filter(x=>o.plural || x[2]!=='s');
        if(!cand.length){ rows.push(`<div class="row plain"><span class="qn"></span><div class="qbody"><div class="en">${spk(s)}${esc(s.en)}</div>${o.ja&&s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`); return; }
        const pref=cand.filter(x=>x[2]!=='s');
        const [ti,base] = withRng(sRng(k), ()=>{ const c = pref.length && (!o.plural || rnd()<.75) ? pref : cand; return c[Math.floor(rnd()*c.length)]; });
        n++;
        rows.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody"><div class="en">${spk(s)}${joinTokens(ts, ts.map((t,i)=>i===ti?`<span class="blank"></span>（${esc(base)}）`:esc(t)))}</div>${o.ja&&s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`);
        ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody ans-full">${spk(s)}${joinTokens(ts, ts.map((t,i)=>i===ti?`<b>${esc(t)}</b>`:esc(t)))}</div></div>`); }); });
    return { title:'語形変化', inst:'（ ）内の語を、文に合う形に変えて空欄に書きなさい。', body:rows.join(''), ans:ans.join('') };
  },
  parse(parts){
    const o=S.parse; let n=0; const rows=[], ans=[];
    parts.forEach(({p,pt})=>{ rows.push(partCaption(p,pt)); ans.push(partCaption(p,pt));
      pt.sentences.forEach(s=>{ const bl=roleBlocks(s);
        const clauseAmb = s.rc && Object.values(s.rc).some(x=>x.amb);
        if(!bl || s.rs!=='ok' || (o.hint==='none' && (s.rg||[]).length) || (o.nest && clauseAmb)){ rows.push(`<div class="row plain"><span class="qn"></span><div class="qbody"><div class="en">${spk(s)}${esc(s.en)}</div></div></div>`); return; }
        n++;
        const q = o.hint==='slash' ? roleHTML(s,'blank',o.nest) : `<div class="parse-line">${esc(s.en)}</div>`;
        rows.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody"><div class="sp-line">${s.sp?`<span class="sp">${esc(s.sp)}:</span>`:''}${q}</div>${o.ja&&s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`);
        ans.push(`<div class="row"><span class="qn">${n}.</span><div class="qbody">${roleHTML(s,'color',o.nest)}</div></div>`);
      }); });
    const inst = o.hint==='slash'
      ? '次の英文の各ブロックが、主語・動詞・目的語・補語・修飾語・接続詞のどれにあたるかを下の線に書きなさい。（点線の語句は答えが書いてあります）'
      : '次の英文を、文の要素ごとに / で区切り、それぞれの下に主語・動詞・目的語・補語・修飾語・接続詞のどれにあたるかを書きなさい。';
    const instN = o.nest ? (o.hint==='slash' ? '大きな枠は「節」です。枠の中の各ブロックと、枠全体の両方の役割を書きなさい（先行詞＝説明される名詞）。' : '節（主語と動詞をふくむまとまり）は、その中も区切って役割を書きなさい。') : '';
    return { title:'文の要素', inst: inst + instN, body:rows.join(''), ans:ROLE_LEGEND+ans.join('') };
  },
  copy(parts){
    const o=S.copy; let html='', ans='';
    parts.forEach(({p,pt})=>{
      const cap=partCaption(p,pt);
      if(o.kind==='roles') html+=cap+pt.sentences.map((s,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody"><div class="sp-line">${s.sp?`<span class="sp">${esc(s.sp)}:</span>`:''}${s.rs==='amb'?`<div class="en">${esc(s.en)}<span class="amb-note">（解釈が分かれるため省略）</span></div>`:roleHTML(s,'color',o.nest)}</div>${s.ja?`<div class="ja-hint">${esc(s.ja)}</div>`:''}</div></div>`).join('');
      else if(o.kind==='read') html+=cap+`<div class="read-check">音読した回数 ${'<i></i>'.repeat(10)}</div><div class="read-grid">${pt.sentences.map(s=>`<div class="en">${spk(s)}${esc(s.en)}</div><div>${esc(s.ja)}</div>`).join('')}</div>`;
      else if(o.kind==='trace') html+=cap+pt.sentences.map((s,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody"><div class="en">${spk(s)}${esc(s.en)}</div><div class="answer-line"></div></div></div>`).join('');
      else { html+=cap+pt.sentences.map((s,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody"><div>${s.sp?`<span class="sp">${esc(s.sp)}:</span>`:''}${esc(s.ja)}</div><div class="answer-line"></div></div></div>`).join('');
        ans+=cap+pt.sentences.map((s,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody ans-text">${spk(s)}${esc(s.en)}</div></div>`).join(''); }
    });
    if(o.kind==='roles') html = ROLE_LEGEND + html;
    const inst={roles:'本文を文の要素（主語・動詞・目的語・補語・修飾語など）のブロックに分けて示しています。', read:'本文を声に出して読みましょう。1回読むごとに□に印をつけます。', trace:'英文を見ながら、下の線に書き写しなさい。', recall:'日本語を見て、本文の英文を書きなさい。'}[o.kind];
    const title={roles:'本文シート（文の要素）',read:'本文シート（音読）',trace:'本文シート（視写）',recall:'本文シート（暗写）'}[o.kind];
    return { title, inst, body:html, ans };
  },
};

/* ================= extras ================= */
function extraPool(k, parts){
  if(k==='qa') return parts.flatMap(({pt})=>pt.qa||[]);
  if(k==='tf') return parts.flatMap(({pt})=>pt.tf||[]);
  const seen=new Set(), out=[]; parts.forEach(({pt})=>(pt.vocab||[]).forEach(v=>{ if(v.w && v.m && !seen.has(v.w)){ seen.add(v.w); out.push(v); } })); return out;
}
const EXTRA_GEN = {
  qa(parts,s){ const qs=pickRandom(extraPool('qa',parts), s.count);
    return { title:'Q & A（本文読解）', inst:'本文の内容について、次の質問に英語で答えなさい。',
      body: qs.map((q,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody"><div class="en">${esc(q.q)}</div>${s.qj&&q.qj?`<div class="ja-hint">${esc(q.qj)}</div>`:''}<div class="answer-line"></div></div></div>`).join(''),
      ans: qs.map((q,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody">${esc(q.q)}<div class="ans-text">→ ${esc(q.a)}</div></div></div>`).join('') }; },
  tf(parts,s){ const qs=pickRandom(extraPool('tf',parts), s.count);
    return { title:'True / False', inst:'本文の内容と合っていればT、合っていなければFを○で囲みなさい。',
      body: qs.map((q,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody"><span class="en">${esc(q.s)}</span><span class="tf-choice"><span>T</span><span>F</span></span></div></div>`).join(''),
      ans: qs.map((q,i)=>`<div class="row"><span class="qn">${i+1}.</span><div class="qbody">${esc(q.s)} <span class="ans-text">→ ${q.t?'T':'F'}</span></div></div>`).join('') }; },
  vocab(parts,s){ const vs=pickRandom(extraPool('vocab',parts), s.count);
    const items=vs.map(v=>({v, d: s.dir==='mix' ? (rnd()<.5?'e2j':'j2e') : s.dir}));
    const q = items.map(({v,d},i)=>`<div class="qitem"><span class="qn">${i+1}.</span><div class="qbody"><div class="vw">${d==='e2j'?`<span class="en">${esc(v.w)}</span>`:`<span>${esc(v.m)} <span class="hintc">(${esc(v.w[0])})</span></span>`}<span class="answer-line"></span></div></div></div>`).join('');
    const a = items.map(({v,d},i)=>`<div class="qitem"><span class="qn">${i+1}.</span><span class="qbody ans-text">${esc(d==='e2j'?v.m:v.w)}</span></div>`).join('');
    return { title:'単語（意味・スペル）', inst:'英語は日本語の意味を、日本語は英語を書きなさい。', body:`<div class="vgrid">${q}</div>`, ans:`<div class="vgrid">${a}</div>` }; },
};

/* ================= long reading (入試形式) ================= */
function buildLongReading(parts){
  const ss = sentPool(parts); const want = S.long;
  const ok = {
    toJapanese: i=>ss[i].ja && wordCount(ss[i].en)>=4,
    fillBlank: i=>wordCount(ss[i].en)>=3 && blankCandidates(ss[i]).length,
    reorder: i=>{ const n=wordCount(ss[i].en); return n>=4 && n<=11 && !/[.?!]\s+\S/.test(ss[i].en); },
    toEnglish: i=>ss[i].ja && wordCount(ss[i].en)>=3 && wordCount(ss[i].en)<=10,
  };
  const pool = shuffle(ss.map((_,i)=>i)); const as = {toJapanese:[],fillBlank:[],reorder:[],toEnglish:[]}; const used=new Set();
  let progress=true;
  while(progress){ progress=false;
    for(const k of Object.keys(as)){ if(as[k].length>=want[k]) continue;
      const i=pool.find(x=>!used.has(x) && ok[k](x)); if(i===undefined) continue; as[k].push(i); used.add(i); progress=true; } }
  const role = {}; for(const k in as) as[k].sort((a,b)=>a-b).forEach(i=>role[i]=k);
  const blanks=[], underlines=[], reorders=[], toEng=[]; const L='abcdefghij';
  const html = ss.map((s,i)=>{
    const ts=tokens(s.en); let h;
    if(role[i]==='fillBlank'){ const c=weighted(blankCandidates(s)); blanks.push(ts[c.i]);
      h=joinTokens(ts, ts.map((t,k)=>k===c.i?`<span class="blank-num">(${blanks.length})</span><span class="blank short"></span>`:esc(t))); }
    else if(role[i]==='toJapanese'){ underlines.push(s.ja); h=`<span class="underline-seg">${esc(s.en)}</span><span class="underline-label">(${L[underlines.length-1]})</span>`; }
    else if(role[i]==='reorder'){ const {end,chunks}=chunksOf(s, S.order.unit==='l'?'s':S.order.unit); reorders.push({en:s.en}); h=`<span class="reorder-num">[${reorders.length}]</span> ( ${scramble(chunks.map(c=>c.text), a=>a.every((c,j)=>c===chunks[j].text)).map(esc).join(' / ')} )${esc(end)}`; }
    else if(role[i]==='toEnglish'){ toEng.push({ja:s.ja,en:s.en}); h=`<span class="toeng-num">【${toEng.length}】</span> <span class="reorder-blank-line">______________________</span>`; }
    else h=esc(s.en);
    return {s,h};
  });
  let txt='', cur='', lastPt=null;
  html.forEach(({s,h})=>{ if(lastPt && s._pt!==lastPt && cur){ txt+=`<p>${cur}</p>`; cur=''; } lastPt=s._pt;
    if(s.sp){ if(cur){ txt+=`<p>${cur}</p>`; cur=''; } txt+=`<span class="dl"><span class="sp">${esc(s.sp)}:</span>${h}</span>`; }
    else { if(s.p && cur){ txt+=`<p>${cur}</p>`; cur=''; } cur += (cur?' ':'') + h; } });
  if(cur) txt+=`<p>${cur}</p>`;
  const qa = pickRandom(extraPool('qa',parts), want.qa), tf = pickRandom(extraPool('tf',parts), want.trueFalse);
  const subs=[];
  if(blanks.length) subs.push({ q:`空所(1)〜(${blanks.length})に入る最も適切な英語1語を書きなさい。`,
    a:`<div>${blanks.map((_,k)=>`<span class="qitem-inline">(${k+1}) <span class="blank"></span></span>`).join('')}</div>`,
    k:`<div>${blanks.map((b,k)=>`<span class="qitem-inline">(${k+1}) <span class="ans-text">${esc(b)}</span></span>`).join('')}</div>` });
  if(underlines.length) subs.push({ q:`下線部${underlines.map((_,k)=>`(${L[k]})`).join('')}を日本語に訳しなさい。`,
    a: underlines.map((_,k)=>`<div class="qitem"><span class="qn">(${L[k]})</span><span class="qbody"><span class="answer-line"></span></span></div>`).join(''),
    k: underlines.map((u,k)=>`<div class="qitem"><span class="qn">(${L[k]})</span><span class="qbody ans-text">${esc(u)}</span></div>`).join('') });
  if(reorders.length) subs.push({ q:`[${reorders.length>1?'1]〜['+reorders.length:'1'}]の( )内の語句を、意味が通るように並べかえて全文を書きなさい。`,
    a: reorders.map((_,k)=>`<div class="qitem"><span class="qn">[${k+1}]</span><span class="qbody"><span class="answer-line"></span></span></div>`).join(''),
    k: reorders.map((r,k)=>`<div class="qitem"><span class="qn">[${k+1}]</span><span class="qbody ans-text">${esc(r.en)}</span></div>`).join('') });
  if(toEng.length) subs.push({ q:`本文中の【${toEng.length>1?'1】〜【'+toEng.length:'1'}】に入る英文を、次の日本語を参考に書きなさい。`,
    a: toEng.map((t,k)=>`<div class="qitem"><span class="qn">【${k+1}】</span><span class="qbody">${esc(t.ja)}<span class="answer-line"></span></span></div>`).join(''),
    k: toEng.map((t,k)=>`<div class="qitem"><span class="qn">【${k+1}】</span><span class="qbody ans-text">${esc(t.en)}</span></div>`).join('') });
  if(qa.length) subs.push({ q:'次の質問に英語で答えなさい。',
    a: qa.map((q,k)=>`<div class="qitem"><span class="qn">${k+1}.</span><span class="qbody"><span class="en">${esc(q.q)}</span><span class="answer-line"></span></span></div>`).join(''),
    k: qa.map((q,k)=>`<div class="qitem"><span class="qn">${k+1}.</span><span class="qbody">${esc(q.q)}<div class="ans-text">→ ${esc(q.a)}</div></span></div>`).join('') });
  if(tf.length) subs.push({ q:'次の英文が本文の内容と合っていればT、合っていなければFを○で囲みなさい。',
    a: tf.map((q,k)=>`<div class="qitem"><span class="qn">${L[k]}.</span><span class="qbody"><span class="en">${esc(q.s)}</span><span class="tf-choice"><span>T</span><span>F</span></span></span></div>`).join(''),
    k: tf.map((q,k)=>`<div class="qitem"><span class="qn">${L[k]}.</span><span class="qbody">${esc(q.s)} <span class="ans-text">→ ${q.t?'T':'F'}</span></span></div>`).join('') });
  return { passage:txt, subs };
}

/* ================= sheet ================= */
function rangeLabel(parts){
  const by=new Map();
  parts.forEach(({g,p,pt})=>{ const k=g+'|'+p.program; if(!by.has(k)) by.set(k,{g,p,ids:[]}); by.get(k).ids.push(pt.id); });
  const gs=new Set(parts.map(x=>x.g));
  return [...by.values()].map(({g,p,ids},i)=>`${gs.size>1||i===0?`中${g} `:''}${p.program}${ids.length===p.parts.length?'':'（'+ids.join('・')+'）'}`).join('、');
}
function build(){
  const parts=selectedParts();
  lastBuild = { parts, secs:[], long:null, fillChoice:{} };
  if(S.cat==='read' && S.read.mode==='long'){ rnd=mulberry32(seed); lastBuild.long=buildLongReading(parts); rnd=Math.random; return; }
  const ex = k=>{ const i=EXTRAS.findIndex(x=>x.key===k); rnd=mulberry32(seed*13+i+1); const out=EXTRA_GEN[k](parts,S.extras[k]); rnd=Math.random; if(out.body) lastBuild.secs.push(out); };
  if(S.cat==='text') lastBuild.secs.push(MAIN_GEN[S.main](parts));
  else if(S.cat==='read'){ if(S.extras.qa.on) ex('qa'); if(S.extras.tf.on) ex('tf'); }
  else ex('vocab');
}
function sheetHTML(b, title, withAnswer, answerOnly){
  const header = `<div class="sheet-header"><div class="title-area"><div class="kicker">${answerOnly?'ANSWER KEY / 解答':'TEST PREP PRINT'}</div><h3>${esc(title)}</h3><div class="range">${esc(rangeLabel(b.parts))}</div></div>
    ${answerOnly?'':`<div class="idbox"><div class="cell"><div class="lbl">組</div></div><div class="cell"><div class="lbl">番</div></div><div class="cell"><div class="lbl">点数</div></div><div class="cell" style="grid-column:span 2;"><div class="lbl">氏名</div></div><div class="cell"><div class="lbl">/100</div></div></div>`}</div>`;
  const foot = `<div class="sheet-foot"><span>刷りたてドリル</span><span>No. ${seed}</span></div>`;
  let body='';
  if(b.long){
    body = `<div class="qtype-section"><h4>長文読解</h4><p class="inst">次の英文を読んで、あとの問いに答えなさい。</p><div class="${answerOnly?'qcols':'qcols long'}">${answerOnly?'':`<div class="passage-block">${b.long.passage}</div>`}
      ${b.long.subs.map((s,i)=>`<div class="lq"><div class="sub-q">問${i+1}　${s.q}</div>${answerOnly||withAnswer?s.k:s.a}</div>`).join('')}</div></div>`;
  } else {
    body = b.secs.map((s,i)=>{
      if(answerOnly && !s.ans) return '';
      const content = answerOnly ? s.ans : s.body + (withAnswer && s.ans ? `<div class="sub-q" style="color:var(--green)">解答</div>${s.ans}` : '');
      return `<div class="qtype-section"><h4>${b.secs.length>1?(i+1)+'　':''}${s.title}</h4>${answerOnly?'':`<p class="inst">${s.inst}</p>`}<div class="qcols">${content}</div></div>`;
    }).join('');
  }
  const L=S.layout; const cls=`cols-${answerOnly ? (L.orient==='l'?3:2) : L.cols} fs-${L.size} or-${L.orient}`;
  return `<div class="sheet ${answerOnly?'answer-key':''} ${cls}">${header}${body}${foot}</div>`;
}
function renderStage(){
  const stage=document.getElementById('stage'); const b=lastBuild; if(!b) return;
  const title=document.getElementById('titleInput').value.trim() || (rangeLabel(b.parts) + (S.cat==='read'&&S.read.mode==='long'?' 長文読解プリント':S.cat==='vocab'?' 単語プリント':' 定期テスト対策プリント'));
  const am=S.ansMode;
  const main = sheetHTML(b, title, am==='inline' && !editMode, false);
  const ans = am==='separate' && !editMode ? sheetHTML(b, title, false, true) : '';
  const canEdit = S.cat==='text' && S.main==='fill';
  stage.innerHTML = `<div class="toolbar no-print">
      <div class="toggles">
        <label><input type="radio" name="ansMode" value="hidden" ${am==='hidden'?'checked':''}> 問題のみ</label>
        <label><input type="radio" name="ansMode" value="inline" ${am==='inline'?'checked':''}> 解答も一緒に表示</label>
        <label><input type="radio" name="ansMode" value="separate" ${am==='separate'?'checked':''}> 解答は別紙（2枚目）</label>
      </div>
      <div class="btns">${canEdit?`<button class="edit-btn" id="editBtn" type="button" aria-pressed="${editMode}">${editMode?'空欄の選択を終える':'空欄を選ぶ'}</button>`:''}<button class="re-btn" id="reBtn" type="button">別の問題で作り直す</button><button class="print-btn" id="printBtn" type="button">印刷する</button></div>
      ${editMode?`<div class="edit-note"><span>語をクリックすると、空欄にする／しないを切りかえられます。選んだ空欄は保存され、次に作るときも使われます（✎ がついた文）。</span><button type="button" id="resetBlanks">この範囲の空欄を自動に戻す</button></div>`:''}
    </div>${main}${ans}<footer class="credit no-print">プリント番号（No.）が同じなら、同じ設定で同じ問題を作り直せます。配点や表現は印刷前に一度確認してください。</footer>`;
  document.getElementById('printBtn').addEventListener('click', ()=>{ if(editMode){ editMode=false; build(); renderStage(); } window.print(); });
  document.getElementById('reBtn').addEventListener('click', ()=>generate(true));
  const eb=document.getElementById('editBtn'); if(eb) eb.addEventListener('click',()=>{ editMode=!editMode; build(); renderStage(); });
  const rb=document.getElementById('resetBlanks'); if(rb) rb.addEventListener('click',()=>{ Object.keys(lastBuild.fillChoice).forEach(k=>delete overrides[k]); saveOverrides(); build(); renderStage(); });
  stage.querySelectorAll('input[name=ansMode]').forEach(r=>r.addEventListener('change',e=>{ S.ansMode=e.target.value; save(); renderStage(); }));
  stage.querySelectorAll('.tk').forEach(t=>t.addEventListener('click',()=>{
    const k=t.dataset.k, i=+t.dataset.i; const cur=new Set(lastBuild.fillChoice[k]||[]);
    cur.has(i)?cur.delete(i):cur.add(i); overrides[k]=[...cur].sort((a,b)=>a-b); saveOverrides();
    const y=window.scrollY; build(); renderStage(); window.scrollTo(0,y);
  }));
}
function generate(newSeed){
  const errBox=document.getElementById('errBox'); errBox.innerHTML='';
  const parts=selectedParts();
  if(!parts.length){ errBox.innerHTML='<div class="err">Program（またはパート）を1つ以上選んでください。</div>'; return; }
  if(S.cat==='read' && S.read.mode==='qa' && !S.extras.qa.on && !S.extras.tf.on){ errBox.innerHTML='<div class="err">Q&A か True/False を1つ以上選んでください。</div>'; return; }
  if(newSeed || !seed) seed = Math.floor(Math.random()*90000)+10000;
  build();
  if(!lastBuild.long && !lastBuild.secs.length){ errBox.innerHTML='<div class="err">この範囲では選んだ形式の問題が作れませんでした。</div>'; return; }
  renderStage();
  if(window.innerWidth<=960) document.getElementById('stage').scrollIntoView({behavior:'smooth'});
}

/* ================= init ================= */
document.getElementById('genBtn').addEventListener('click', ()=>{ editMode=false; generate(true); });
document.getElementById('titleInput').addEventListener('input', ()=>{ if(lastBuild) renderStage(); });
if(!selected.size){ const g=gradeData(S.grade); if(g.programs[0]) g.programs[0].parts.forEach((_,ji)=>selected.add(key(S.grade,0,ji))); }
renderGradeTabs(); renderProgList(); renderCat(); renderLayout(); applyPage();
</script>
